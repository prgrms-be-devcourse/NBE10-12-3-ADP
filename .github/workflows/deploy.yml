name: 🚀 배포!

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/deploy.yml"
      - "back/src/**"
      - "back/build.gradle.kts"
      - "back/settings.gradle.kts"
      - "back/Dockerfile"
      - "terraform/**"
      - "widget/**"

env:
  BACK_IMAGE_NAME: nbe10-12-3-adp
  BACK_CONTAINER_NAME: application
  BACK_DOCKERFILE_DIR: back
  WIDGET_IMAGE_NAME: nbe10-12-3-adp-widget
  WIDGET_CONTAINER_NAME: widget
  WIDGET_DOCKERFILE_DIR: widget
  INSTANCE_TAG_NAME: terraform-ec2-1
  DOCKER_NETWORK: common

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  createTagAndRelease:
    name: 1. 태그 및 릴리즈 생성
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create_tag.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: 태그 생성 (ex. v1.2.3)
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 생성
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          release_name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          draft: false
          prerelease: false

  buildAndPushDockerImage:
    name: 2. 도커 이미지 빌드 및 푸시
    needs: [createTagAndRelease]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Docker Buildx 설치
        uses: docker/setup-buildx-action@v4

      - name: 레지스트리 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 저장소 소유자명을 소문자로 (GHCR 경로 표준화)
        env:
          OWNER: "${{ github.repository_owner }}"
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: "`back` 이미지 빌드 및 푸시"
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACK_DOCKERFILE_DIR }}
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=back
          cache-to: type=gha,scope=back,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.BACK_IMAGE_NAME }}:${{ needs.createTagAndRelease.outputs.tag}}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.BACK_IMAGE_NAME }}:latest

      - name: "`widget` 이미지 빌드 및 푸시"
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WIDGET_DOCKERFILE_DIR }}
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=widget
          cache-to: type=gha,scope=widget,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.WIDGET_IMAGE_NAME }}:${{ needs.createTagAndRelease.outputs.tag}}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.WIDGET_IMAGE_NAME }}:latest

  deploy:
    name: 3. 배포
    runs-on: ubuntu-latest
    needs: [createTagAndRelease, buildAndPushDockerImage]

    steps:
      - name: AWS 자격 구성
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 인스턴스 ID 가져오기
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.INSTANCE_TAG_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          [[ -n "${INSTANCE_ID}" && "${INSTANCE_ID}" != "None" ]] || { echo "No running instance found"; exit 1; }
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: AWS SSM `send-command`
        uses: peterkimzz/aws-ssm-send-command@master
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          instance-ids: ${{ env.INSTANCE_ID }}
          working-directory: /
          comment: Deploy
          command: |
            set -Eeuo pipefail

            LOG="/tmp/ssm-$(date +%Y%m%d_%H%M%S).log"
            exec > >(awk '{ fflush(); print strftime("[%Y-%m-%d %H:%M:%S]"), $0 }' | tee -a "$LOG")
            exec 2> >(awk '{ fflush(); print strftime("[%Y-%m-%d %H:%M:%S]"), $0 }' | tee -a "$LOG" >&2)

            OWNER_LC="${{ github.repository_owner }}"
            OWNER_LC="${OWNER_LC,,}"
            IMAGE_TAG='${{ needs.createTagAndRelease.outputs.tag }}'

            BACK_IMAGE_NAME='${{ env.BACK_IMAGE_NAME }}'
            BACK_IMAGE="ghcr.io/${OWNER_LC}/${BACK_IMAGE_NAME}:${IMAGE_TAG}"
            BACK_CONTAINER_NAME="${{ env.BACK_CONTAINER_NAME }}"

            WIDGET_IMAGE_NAME='${{ env.WIDGET_IMAGE_NAME }}'
            WIDGET_IMAGE="ghcr.io/${OWNER_LC}/${WIDGET_IMAGE_NAME}:${IMAGE_TAG}"
            WIDGET_CONTAINER_NAME="${{ env.WIDGET_CONTAINER_NAME }}"

            NET="${{ env.DOCKER_NETWORK }}"

            docker pull $BACK_IMAGE
            docker pull $WIDGET_IMAGE

            docker stop $BACK_CONTAINER_NAME || true
            docker stop $WIDGET_CONTAINER_NAME || true

            docker rm $BACK_CONTAINER_NAME || true
            docker rm $WIDGET_CONTAINER_NAME || true

            docker run -d \
              --restart unless-stopped \
              --name $BACK_CONTAINER_NAME \
              --network $NET \
              --env-file .env \
              -p 8080:8080 \
              $BACK_IMAGE
            docker run -d \
              --restart unless-stopped \
              --name $WIDGET_CONTAINER_NAME \
              --network $NET \
              -e PORT=3001 \
              -p 3001:3001 \
              $WIDGET_IMAGE

            {
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep -F "ghcr.io/${OWNER_LC}/${BACK_IMAGE_NAME}:" \
                | grep -vxF "ghcr.io/${OWNER_LC}/${BACK_IMAGE_NAME}:${IMAGE_TAG}" \
                | grep -vxF "ghcr.io/${OWNER_LC}/${BACK_IMAGE_NAME}:latest" \
                | xargs -r docker rmi
            } || true
            {
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep -F "ghcr.io/${OWNER_LC}/${WIDGET_IMAGE_NAME}:" \
                | grep -vxF "ghcr.io/${OWNER_LC}/${WIDGET_IMAGE_NAME}:${IMAGE_TAG}" \
                | grep -vxF "ghcr.io/${OWNER_LC}/${WIDGET_IMAGE_NAME}:latest" \
                | xargs -r docker rmi
            } || true
