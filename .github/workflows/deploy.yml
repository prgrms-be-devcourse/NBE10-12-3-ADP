name: 🚀 배포!

on:
  push:
    branches: [dev, ci/ADP-205]
    paths:
      - ".github/workflows/deploy.yml"
      - "src/**"
      - ".env.example"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "Dockerfile"

env:
  CONTAINER_REGISTRY: ghcr.io
  REPOSITORY_OWNER: prgrms-be-devcourse
  IMAGE_NAME: nbe10-12-3-adp

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-push-docker-image:
    name: 1. 도커 이미지 빌드 및 푸시
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./back
          platforms: linux/arm64
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}

  deploy:
    name: 2. EC2에서 도커 이미지 풀 및 컨테이너 실행
    runs-on: ubuntu-latest
    needs: [build-and-push-docker-image]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:latest
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
        run: |
          SCRIPT=$(cat <<DEPLOY
          docker stop application || true
          docker rm application || true
          docker rmi $IMAGE || true
          docker run -d \
            --name application \
            --network common \
            --env-file .env \
            -p 8080:8080 \
            $IMAGE
          DEPLOY
          )
          PARAMS=$(jq -n --arg cmd "$SCRIPT" '{"commands":[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID")

          STATUS=$(echo "$OUTPUT" | jq -r '.Status')
          echo "Status: $STATUS"
          echo "--- stdout ---"
          echo "$OUTPUT" | jq -r '.StandardOutputContent'
          echo "--- stderr ---"
          echo "$OUTPUT" | jq -r '.StandardErrorContent'

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
